# Minimal project metadata so Vercel's Python runtime can resolve dependencies
# and point at the existing FastAPI application. No backend code is changed or
# duplicated.
[project]
name = "cloudops-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "boto3"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "main:app"
