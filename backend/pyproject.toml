# Minimal project metadata so Vercel's Python runtime can resolve dependencies
# and point at the existing FastAPI application. No backend code is changed or
# duplicated.
[project]
name = "cloudops-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "boto3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1",
  "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "main:app"
