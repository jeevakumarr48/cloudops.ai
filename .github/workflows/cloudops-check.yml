name: CloudOps AI checks

# Safe, read-only CI: no AWS credentials are required and no infrastructure
# is deployed or changed. Terraform is formatted, validated and tested with
# mocked providers; it is never planned against a real account or applied.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint (ruff, including security rules)
        working-directory: backend
        run: ruff check . ../scripts

      - name: Type check (mypy)
        working-directory: backend
        run: mypy .

      - name: Unit tests with coverage (fails under 90%)
        working-directory: backend
        run: python -m pytest tests -q --cov=. --cov-report=term --cov-report=xml

      - name: Recommendation evaluation (offline, no AWS or AI calls)
        working-directory: backend
        run: python -m evals.run_eval --json eval-report.json

      - name: Database migrations apply cleanly and match the models
        working-directory: backend
        run: |
          rm -f /tmp/ci.db
          DATABASE_URL=sqlite:////tmp/ci.db python -m alembic -c alembic.ini upgrade head
          DATABASE_URL=sqlite:////tmp/ci.db python -m alembic -c alembic.ini check

      - name: Dependency vulnerability audit
        run: pip-audit -r backend/requirements.txt

  terraform:
    # Validates and tests the Terraform for the app's own IAM role and Vercel
    # projects. Both providers are mocked in `terraform test`, so no cloud
    # credentials exist in CI and nothing can be applied.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff infrastructure infra/terraform

      - name: Validate and test (mocked providers, never applies)
        run: |
          for root in infra/terraform/aws infra/terraform/vercel; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            terraform -chdir="$root" test
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Unit and component tests (Vitest)
        run: npm run test:coverage

      - name: Dependency vulnerability audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

  e2e:
    # The real API (SQLite, no AWS credentials, no AI provider) and the
    # frontend, driven in Chromium on desktop and phone viewports.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend requirements
        run: pip install -r backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    # Builds both images and runs the full stack on Postgres (the same engine
    # as Neon in production), then runs the read-only smoke test against it.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and start Postgres, API and frontend
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Smoke test as a signed-in operator
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8080' \
            -d '{"email":"operator@example.com","password":"ci-only-password-not-secret"}' > /dev/null
          python3 scripts/smoke_test.py http://localhost:8080 --email operator@example.com --password ci-only-password-not-secret

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
