name: CloudOps AI checks

# Safe, read-only CI: no AWS credentials are required and no infrastructure
# is deployed or changed. Terraform is only ever checked for formatting.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Python syntax check
        run: python -m compileall -q backend

      - name: Run unit tests
        run: python -m pytest backend/tests -q

      - name: Detect Terraform files
        id: terraform
        run: |
          if find infrastructure -name '*.tf' -print -quit 2>/dev/null | grep -q .; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Terraform
        if: steps.terraform.outputs.present == '1'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format check (never applies)
        if: steps.terraform.outputs.present == '1'
        run: terraform fmt -check -recursive infrastructure

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
