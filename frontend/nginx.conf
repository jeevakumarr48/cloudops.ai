server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Same security headers as frontend/vercel.json.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Same policy as frontend/vercel.json, minus upgrade-insecure-requests: the
  # local stack is plain http.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Same-origin API, so the HttpOnly session cookie is first-party.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  # /health (liveness) and /health/ready (readiness).
  location ^~ /health {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location / {
    try_files $uri /index.html;
  }
}
